version: "3.8"
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: roommates_dev
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:6
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["./bin/wait-for-db.sh", "bash", "-lc", "bundle exec rails db:create db:migrate db:seed && bundle exec puma -C config/puma.rb"]
    volumes:
      - ./backend:/rails
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: "postgres://postgres:postgres@db:5432/roommates_dev"
      REDIS_URL: "redis://redis:6379/0"
    env_file:
      - ./backend/.env.example
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
    ports:
      - "3009:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
      NEXT_PUBLIC_CLOUDINARY_CLOUD: das0u1ggc
      NEXT_PUBLIC_CLOUDINARY_PRESET: roomate

volumes:
  db-data:
